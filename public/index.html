<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>드렉사우 디럭스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby">
        <h1>Drecksau Deluxe</h1>
        <button onclick="createRoom()" class="btn">새 방 만들기</button>
        <br><br>
        <input type="text" id="roomInput" placeholder="방 코드 입력">
        <button onclick="joinRoom()" class="btn">방 참가</button>
    </div>

    <div id="waiting-room" style="display: none;">
        <h2>게임 대기실</h2>
        <p>방 코드: <b id="display-room-code"></b></p>
        <p>현재 접속 인원: <span id="player-count">1</span>명</p>
        <button id="start-btn" onclick="startGame()" class="btn btn-start">게임 시작하기</button>
    </div>

    <div id="game-board" style="display: none;">
        <div id="top-bar">
            <span>방 코드: <b id="board-room-code"></b></span>
            <span id="turn-indicator"></span>
        </div>
        
        <div id="opponents-area"></div>

        <div id="center-area">
            <div id="deck" class="card card-back">덱</div>
            <div id="played-card-display"></div>
            <button id="discard-btn" onclick="discardHand()" class="btn btn-warning">낼 카드 없음 (전부 버리기)</button>
        </div>

        <div id="my-area">
            <h3>내 돼지</h3>
            <div id="my-pigs" class="pig-zone"></div>
            <h3>내 손에 든 카드 (클릭 후 대상 지정)</h3>
            <div id="my-hand" class="hand-zone"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
